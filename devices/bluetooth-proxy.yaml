substitutions:
  name: "bluetooth-proxy"
  # BM2 battery monitor to listen for. Reading one needs the address and nothing
  # else — the AES key is fixed across every BM2 — so a wrong value here is
  # silent: the proxy keeps working and the battery entities never leave unknown.
  bm2_mac: "E4:66:E5:8A:BC:CD"
  bm2_name: "BM2 Battery"
packages:
  # renovate: datasource=github-releases depName=esphome/bluetooth-proxies
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/olimex/olimex-esp32-poe-iso.yaml@26.8.2
  willowbird-core: !include
    file: common/core.yaml
  willowbird-ota: !include
    file: common/cicd.yaml
  # Passive BM2 battery decode. Listens to advertisements the proxy already
  # receives; it opens no connection and takes no bluetooth_proxy slot.
  bm2-battery: !include
    file: vendor/bm2-battery.yaml
api:

# Web UI. The shared cicd package already provides the v3 web_server and the
# "Firmware" section; add this device's own Device Information / Controls groups
# and populate them. (The olimex package brings the bluetooth proxy plus Safe
# Mode / Factory reset buttons, but no device-info sensors or a restart button.)
web_server:
  sorting_groups:
    - id: info_group
      name: "Device Information"
      sorting_weight: 10
    - id: device_control_group
      name: "Device Controls"
      sorting_weight: 20

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      icon: mdi:ip-network-outline
      web_server:
        sorting_group_id: info_group
        sorting_weight: 10
    mac_address:
      name: "MAC Address"
      icon: mdi:network-outline
      web_server:
        sorting_group_id: info_group
        sorting_weight: 20

sensor:
  - platform: uptime
    name: "Uptime"
    icon: mdi:timer-outline
    web_server:
      sorting_group_id: info_group
      sorting_weight: 30

button:
  - platform: restart
    name: "Restart"
    icon: mdi:restart
    web_server:
      sorting_group_id: device_control_group
      sorting_weight: 10
